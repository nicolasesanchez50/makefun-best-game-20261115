<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LANTERN TIDE</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  #game {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    background: #05060f;
    touch-action: none;
    cursor: crosshair;
  }
  /* Read aloud, never seen: what a screen reader announces about the run. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Lantern Tide. Fly a lantern kite from a small boat at dusk: hold space or the mouse to pull the line, steer with A and D, harvest glowing gust rings and fill the lantern before the squall takes the sky."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
